<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Oh WOW! My first hero page</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.trunk.min.js"></script>
    <style>
        body {
            margin:0
            font-family: Arial, sans-serif;
        }
        #hero {
            position: relative;
            height: 100vh;
            background-color:#222426;
            color: palevioletred;
            text-align:center;
        }
        #hero-text{
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            z-index: 1;
        }
        #hero h1 {
            position: relative;
            z-index:1;
            font-size: clamp(32px, 6vw, 80px);
            margin : 0;
        }
        #hero h2 {
            position: relative;
            z-index:1;
            font-size: clamp(18px, 6vw, 32px);
            margin-top : 16px;
        }
        #btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            background-color: blueviolet;
            color:palevioletred;
            font-family: Arial, sans-serif;
            border-radius:50%;
            width:110px;
            height:110px;
            border:4px solid palevioletred;
            cursor:pointer;
            transition:transform 0.3s ease, background-color 0.3s ease;
        }
        #btn:hover{
            traform: translate(-50%, -50%) scale(1.1);
            background-color:brown;
        }
    </style>
  </head>

    <body>
      <section id="hero">
        <div id="hero-text"><h1>Hello there, I'm Alessia.</h1>
        <h2>You are just looking at my very first hero page</h2>
        </div>
        <button id="btn">NOT YET</button>
      </section>

      <script>
        const effect = VANTA.TRUNK({
          el: "#hero",
          backgroundColor: 0x222426,
          color: 0x98465f,
          spacing: 7,
          chaos: 5.5,
          mouseControls: false,
          touchControls: false,
          gyroControls: false,
        });
        const button = document.getElementById("btn");
        button.addEventListener("mouseenter", function () {
            effect.setOptions({chaos: 0.5});
            console.log("Mouse sopra il pulsante:", effect.options.chaos);
        });
        button.addEventListener("mouseleave", function () {
            effect.setOptions({chaos: 5.5});
            console.log("Mouse fuori il pulsante:", effect.options.chaos);
        });
        </script>
    </body>
  </head>
</html>
